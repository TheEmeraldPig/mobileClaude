name: Build Orbit Hop

# Builds OrbitHop.apk (Android) and OrbitHop.exe (Windows) on every push that changes
# the game, then publishes them as a release named hop-build-<number>.
on:
  push:
    paths:
      - 'hop/**'
      - '.github/workflows/hop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: hop/go.sum
      - name: Install libraries for tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev xvfb
      - name: Test
        run: xvfb-run -a go test ./game
      - name: Build OrbitHop.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X github.com/TheEmeraldPig/mobileClaude/hop/game.Version=${{ github.run_number }}" \
            -o OrbitHop.exe ./cmd/hop
      - uses: actions/upload-artifact@v4
        with:
          name: hop-windows
          path: hop/OrbitHop.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: hop/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the Android SDK and NDK that come with the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - name: Build the game library (.aar)
        working-directory: hop
        run: |
          mkdir -p android/app/libs
          go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.8.8
          ebitenmobile bind -target android -androidapi 23 -javapkg com.theemeraldpig.hop \
            -ldflags "-X github.com/TheEmeraldPig/mobileClaude/hop/game.Version=${{ github.run_number }}" \
            -o android/app/libs/hop.aar ./mobile
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build OrbitHop.apk
        working-directory: hop/android
        run: |
          gradle assembleRelease -PhopVersion=${{ github.run_number }} --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../OrbitHop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hop-android
          path: hop/OrbitHop.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hop-*
          merge-multiple: true
      # Not marked "latest": Mote's updater reads the latest release.
      - name: Publish release hop-build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "hop-build-${{ github.run_number }}" OrbitHop.apk OrbitHop.exe \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "Orbit Hop build ${{ github.run_number }}" \
            --notes "Android: download OrbitHop.apk on your phone and open it to install. Windows: download OrbitHop.exe and run it."
