name: Build Lens app

# Builds Lens.apk (the Android app that shows the hub's control panel), checks it on an
# emulator against a real copy of the hub, and publishes it as a release named lens-app-<number>.
on:
  push:
    paths:
      - 'glasses/app/**'
      - 'glasses/pi/panel.html'
      - '.github/workflows/lens-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Lens.apk
        working-directory: glasses/app
        run: |
          gradle assembleRelease -PlensVersion=${{ github.run_number }} --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../../Lens.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lens-apk
          path: Lens.apk

  # Runs the app on an emulator, connected to the hub running on the build machine
  # (without Claude Code, which isn't installed there), and prints small screenshots into the log.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lens-apk
      - name: Start a test hub
        run: |
          cat > /tmp/hub.toml <<'TOML'
          data_dir = "/tmp/lens-data"
          [claude]
          bin = "true"
          [ears]
          engine = "none"
          [mouth]
          engine = "none"
          [eyes]
          source = "none"
          [hub]
          port = 8765
          token = "test"
          TOML
          nohup python3 glasses/pi/lens.py --config /tmp/hub.toml > /tmp/hub.log 2>&1 &
          echo $! > /tmp/hub.pid
          sleep 3
          curl -s localhost:8765/status
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Lens on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r Lens.apk
            adb shell pm grant com.theemeraldpig.lens android.permission.RECORD_AUDIO
            adb shell pm grant com.theemeraldpig.lens android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am start -n com.theemeraldpig.lens/.MainActivity --es hub http://10.0.2.2:8765 --es token test
            sleep 25
            adb forward tcp:8766 tcp:8766
            curl -s -m 5 -H "X-Lens-Token: test" localhost:8766/status > listen-check.txt || echo "status failed" > listen-check.txt
            curl -s -m 5 -H "X-Lens-Token: wrong" localhost:8766/status >> listen-check.txt || true
            curl -s -m 50 -X POST -H "X-Lens-Token: test" localhost:8766/listen >> listen-check.txt || echo "listen failed" >> listen-check.txt
            cat listen-check.txt
            adb exec-out screencap -p > shot-panel.png
            adb shell input swipe 540 1800 540 600 400
            sleep 3
            adb exec-out screencap -p > shot-panel-lower.png
            kill "$(cat /tmp/hub.pid)" || true
            adb shell am force-stop com.theemeraldpig.lens
            adb shell am start -n com.theemeraldpig.lens/.MainActivity
            sleep 12
            adb exec-out screencap -p > shot-offline.png
            adb logcat -d > logcat.txt
            grep -E "chromium|Lens|FATAL|AndroidRuntime" logcat.txt | tail -60 || true
      - name: Hub log
        if: always()
        run: tail -40 /tmp/hub.log || true
      # Screenshots go to the lens-ci-shots branch so they can be looked at without downloading artifacts.
      - name: Push screenshots to the lens-ci-shots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp shot-*.png listen-check.txt /tmp/shots/ 2>/dev/null || true
          grep -E "chromium|FATAL|AndroidRuntime|lens|Lens" logcat.txt 2>/dev/null | tail -80 > /tmp/shots/logcat-excerpt.txt || true
          cd /tmp/shots
          git init -q && git checkout -q -b lens-ci-shots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Lens app emulator screenshots, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" lens-ci-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lens-emulator-test
          path: |
            shot-*.png
            logcat.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lens-apk
      - name: Publish release lens-app-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "lens-app-${{ github.run_number }}" Lens.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "Lens app build ${{ github.run_number }}" \
            --notes "Open this page on the phone that runs the hub, download Lens.apk and open it to install. The hub must be running in Termux."
