name: Build Mote

# Builds the Windows .exe and the Android .apk on every push that changes the game,
# then publishes them as a GitHub release named build-<number>.
on:
  push:
    paths:
      - 'mote/**'
      - '.github/workflows/mote.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: mote/go.sum
      - name: Install libraries for tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev xvfb
      - name: Test (world generation must match the web version)
        run: xvfb-run -a go test ./game
      - name: Build Mote.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X github.com/TheEmeraldPig/mobileClaude/mote/game.Version=${{ github.run_number }}" \
            -o Mote.exe ./cmd/mote
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags steam \
            -ldflags "-s -w -H windowsgui -X github.com/TheEmeraldPig/mobileClaude/mote/game.Version=${{ github.run_number }}" \
            -o Mote-steam.exe ./cmd/mote
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            mote/Mote.exe
            mote/Mote-steam.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: mote/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the Android SDK and NDK that come with the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "SDK: $ANDROID_HOME  NDK: $ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
      - name: Build the game library (.aar)
        working-directory: mote
        run: |
          mkdir -p android/app/libs
          go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.8.8
          ebitenmobile bind -target android -androidapi 23 -javapkg com.theemeraldpig.mote \
            -ldflags "-X github.com/TheEmeraldPig/mobileClaude/mote/game.Version=${{ github.run_number }}" \
            -o android/app/libs/mote.aar ./mobile
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Mote.apk
        working-directory: mote/android
        run: |
          gradle assembleRelease -PmoteVersion=${{ github.run_number }} --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../Mote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mote/Mote.apk

  # Starts Mote.apk on an Android emulator and saves a screenshot and the system log,
  # so problems on phones can be seen without a phone. It does not block the release.
  android-test:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Mote on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r Mote.apk
            adb logcat -c
            adb shell am start -n com.theemeraldpig.mote/.MainActivity
            sleep 40
            adb exec-out screencap -p > shot-menu.png
            # tap the gold Play button (top right of the main menu)
            adb shell input swipe 450 30 450 30 600
            sleep 30
            adb exec-out screencap -p > shot-later.png
            adb logcat -d > logcat.txt
            PID=$(adb shell pidof com.theemeraldpig.mote || true); echo "Mote pid: $PID"
            if [ -n "$PID" ]; then grep " $PID " logcat.txt | tail -150; fi
            grep -E "GoLog|Mote|FATAL|DEBUG  :|libc  " logcat.txt | tail -100 || true
            adb shell dumpsys activity top | grep -iE "ACTIVITY|mote" | head -5 || true
            for f in shot-menu.png shot-later.png; do echo "== $f"; python3 mote/android/tools/shrink_png.py $f 192 || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: |
            shot-*.png
            logcat.txt

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Mote.exe Mote-steam.exe Mote.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Mote build ${{ github.run_number }}" \
            --notes "Windows: download Mote.exe and run it. Android: download Mote.apk on your phone and open it to install. Mote-steam.exe is the Steam build (no built-in updater)."
