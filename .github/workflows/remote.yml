name: Build Remote

# Builds Remote's Windows .exe and Android .apk on every push that changes remote/,
# then publishes them as a GitHub release named remote-build-<number> (never marked latest).
on:
  push:
    paths:
      - 'remote/**'
      - '.github/workflows/remote.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: remote/go.sum
      - name: Install libraries for tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev xvfb
      - name: Test (game, islands, server)
        run: xvfb-run -a go test ./game ./mmo ./srv && go build -o /dev/null ./server 
      - name: Build Remote.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X github.com/TheEmeraldPig/mobileClaude/remote/game.Version=${{ github.run_number }} -X github.com/TheEmeraldPig/mobileClaude/remote/game.ServerURL=${{ vars.REMOTE_SERVER_URL }}" \
            -o Remote.exe ./cmd/remote
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags steam \
            -ldflags "-s -w -H windowsgui -X github.com/TheEmeraldPig/mobileClaude/remote/game.Version=${{ github.run_number }} -X github.com/TheEmeraldPig/mobileClaude/remote/game.ServerURL=${{ vars.REMOTE_SERVER_URL }}" \
            -o Remote-steam.exe ./cmd/remote
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            remote/Remote.exe
            remote/Remote-steam.exe

  # The game server's Docker image (what Render runs)
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        working-directory: remote
        run: docker build -f server/Dockerfile -t remote-server .
      - name: Start it and check it answers
        run: |
          docker run -d --rm -p 8080:8080 --name rs remote-server
          for i in $(seq 1 20); do curl -sf localhost:8080/ && break; sleep 1; done
          curl -sf localhost:8080/ | grep "Remote server"
          docker stop rs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: remote/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the Android SDK and NDK that come with the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "SDK: $ANDROID_HOME  NDK: $ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
      - name: Build the game library (.aar)
        working-directory: remote
        run: |
          mkdir -p android/app/libs
          go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.8.8
          ebitenmobile bind -target android -androidapi 23 -javapkg com.theemeraldpig.remote \
            -ldflags "-X github.com/TheEmeraldPig/mobileClaude/remote/game.Version=${{ github.run_number }} -X github.com/TheEmeraldPig/mobileClaude/remote/game.ServerURL=${{ vars.REMOTE_SERVER_URL }}" \
            -o android/app/libs/remote.aar ./mobile
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Remote.apk
        working-directory: remote/android
        run: |
          gradle assembleRelease -PmoteVersion=${{ github.run_number }} --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../Remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: remote/Remote.apk

  # Starts Remote.apk on an Android emulator and saves a screenshot and the system log,
  # so problems on phones can be seen without a phone. It does not block the release.
  android-test:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Remote on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r Remote.apk
            adb logcat -c
            adb shell am start -n com.theemeraldpig.remote/.MainActivity
            sleep 40
            adb exec-out screencap -p > shot-menu.png
            # tap Play solo (second button on the main menu), then look at the game itself
            adb shell input swipe 450 104 450 104 600
            sleep 45
            adb exec-out screencap -p > shot-game.png
            sleep 15
            adb exec-out screencap -p > shot-later.png
            adb logcat -d > logcat.txt
            PID=$(adb shell pidof com.theemeraldpig.remote || true); echo "Remote pid: $PID"
            if [ -n "$PID" ]; then grep " $PID " logcat.txt | tail -150; fi
            grep -E "GoLog|Remote|FATAL|DEBUG  :|libc  " logcat.txt | tail -100 || true
            # a Java crash: show its stack trace
            grep -A40 "FATAL EXCEPTION" logcat.txt | head -80 || true
            adb shell dumpsys activity top | grep -iE "ACTIVITY|remote" | head -5 || true
            for f in shot-menu.png shot-later.png shot-game.png; do echo "== $f"; python3 remote/android/tools/shrink_png.py $f 192 || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: |
            shot-*.png
            logcat.txt

  release:
    needs: [windows, android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Mote shares this repository and its updaters install the "latest" release, so Remote's
      # releases must never be marked latest. Remote's own updaters look for remote-build-N tags.
      - name: Publish release remote-build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "remote-build-${{ github.run_number }}" Remote.exe Remote-steam.exe Remote.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "Remote build ${{ github.run_number }}" \
            --notes "Remote (not Mote). Windows: download Remote.exe and run it. Android: download Remote.apk on your phone and open it to install. Remote-steam.exe is the Steam build (no built-in updater)."
