name: Build Blob Split

# Builds Blob Split for Android on every push that changes it:
# - BlobSplit.apk to install straight on a phone
# - BlobSplit.aab, the bundle Google Play wants
# and publishes them as a GitHub release named blobsplit-<number>.
#
# For Google Play, add these repository secrets so the bundle is signed with your
# private upload key (see blobsplit/README.md): BLOBSPLIT_UPLOAD_KEYSTORE (the .jks
# file, base64), BLOBSPLIT_UPLOAD_KEYSTORE_PASSWORD, BLOBSPLIT_UPLOAD_KEY_ALIAS,
# BLOBSPLIT_UPLOAD_KEY_PASSWORD. Without them everything is signed with the sideload key.
on:
  push:
    paths:
      - 'blobsplit/**'
      - '.github/workflows/blobsplit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: blobsplit/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install libraries for tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev xvfb
      - name: Test
        working-directory: blobsplit
        run: go vet ./... && xvfb-run -a go test ./...
      - name: Use the Android SDK and NDK that come with the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          ls "$ANDROID_HOME/platforms" | tail -3
      - name: Build the game library (.aar)
        working-directory: blobsplit
        run: |
          mkdir -p android/app/libs
          go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.8.8
          ebitenmobile bind -target android -androidapi 23 -javapkg com.theemeraldpig.blobsplit \
            -ldflags "-X github.com/TheEmeraldPig/mobileClaude/blobsplit/game.Version=${{ github.run_number }}" \
            -o android/app/libs/blobsplit.aar ./mobile
      - name: Set up the Play upload key
        env:
          KEYSTORE: ${{ secrets.BLOBSPLIT_UPLOAD_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "Signing with the Play upload key"
          else
            echo "No upload key secret: signing with the sideload key (not for Google Play)"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build BlobSplit.apk and BlobSplit.aab
        working-directory: blobsplit/android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.BLOBSPLIT_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.BLOBSPLIT_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.BLOBSPLIT_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease -PappVersion=${{ github.run_number }} --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../BlobSplit.apk
          cp app/build/outputs/bundle/release/app-release.aab ../BlobSplit.aab
      - uses: actions/upload-artifact@v4
        with:
          name: blobsplit
          path: |
            blobsplit/BlobSplit.apk
            blobsplit/BlobSplit.aab

  # Starts the APK on an emulator and saves a screenshot, so it can be checked without a
  # phone. It does not block the release.
  android-test:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blobsplit
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Blob Split on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r BlobSplit.apk
            adb shell am start -n com.theemeraldpig.blobsplit/.MainActivity
            sleep 30
            adb exec-out screencap -p > shot-start.png
            adb logcat -d > logcat.txt
            grep -E "BlobSplit|GoLog|FATAL" logcat.txt | tail -50 || true
            if grep -qE "panic:|crashed:" logcat.txt; then echo "::error::The game crashed on the emulator"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blobsplit-emulator
          path: shot-*.png

  release:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blobsplit
      - name: Publish release blobsplit-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        # --latest=false: Mote's updaters read the repository's latest release
        run: |
          gh release create "blobsplit-${{ github.run_number }}" BlobSplit.apk BlobSplit.aab \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "Blob Split build ${{ github.run_number }}" \
            --notes "Android: download BlobSplit.apk on your phone and open it to install. BlobSplit.aab is the bundle to upload to Google Play."
