name: Slice Lens glasses

# Slices the glasses' print plate (glasses/hardware/stl/lens_glasses_plate.stl) with OrcaSlicer for
# the owner's LulzBot TAZ 6 + Aerostruder (2.85 mm PLA, 0.5 mm nozzle), using OrcaSlicer's TAZ 6
# presets plus the owner's own settings, and publishes the G-code as a release named glasses-print-<number>.
on:
  push:
    paths:
      - 'glasses/hardware/stl/**'
      - 'glasses/hardware/printer/**'
      - '.github/workflows/glasses-print.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  slice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install what OrcaSlicer needs to run without a screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0t64 libwebkit2gtk-4.1-0 libegl1 libgl1 libglu1-mesa libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsecret-1-0 >/dev/null
      - name: Download OrcaSlicer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the version the owner slices with; fall back to the newest release if it's not there
          TAG=v2.4.2
          gh release view "$TAG" --repo OrcaSlicer/OrcaSlicer >/dev/null 2>&1 || TAG=$(gh release view --repo OrcaSlicer/OrcaSlicer --json tagName -q .tagName)
          gh release view "$TAG" --repo OrcaSlicer/OrcaSlicer --json assets -q '.assets[].name' | tee assets.txt
          # the 64-bit Intel/AMD Linux build (not the ARM one); prefer the Ubuntu 24.04 build
          NAME=$(grep -E 'Linux.*\.AppImage$' assets.txt | grep -viE 'aarch64|arm' | grep -i 'ubuntu2404' | head -1)
          [ -n "$NAME" ] || NAME=$(grep -E 'Linux.*\.AppImage$' assets.txt | grep -viE 'aarch64|arm' | head -1)
          echo "Using OrcaSlicer $TAG: $NAME"
          gh release download "$TAG" --repo OrcaSlicer/OrcaSlicer --pattern "$NAME" --output orca.AppImage
          chmod +x orca.AppImage
          ./orca.AppImage --appimage-extract >/dev/null
          ls squashfs-root | head
      - name: Build the printer, print and filament profiles
        run: python3 glasses/hardware/printer/orca_profiles.py squashfs-root/resources/profiles profiles
      - name: Slice
        run: |
          mkdir -p out
          xvfb-run -a ./squashfs-root/AppRun --slice 0 --debug 2 \
            --load-settings "profiles/machine.json;profiles/process.json" \
            --load-filaments "profiles/filament.json" \
            --outputdir out glasses/hardware/stl/lens_glasses_plate.stl 2>&1 | tail -60
          ls -la out
          G=$(ls out/*.gcode | head -1)
          test -n "$G"
          mv "$G" "Lens-glasses-v2_TAZ6-Aerostruder_PLA.gcode"
          head -20 Lens-glasses-v2_TAZ6-Aerostruder_PLA.gcode
          grep -E "^; (estimated printing time|total filament|filament used|total layer)" Lens-glasses-v2_TAZ6-Aerostruder_PLA.gcode | head
      # keep a copy on a branch so it can be checked without downloading release files
      - name: Push the G-code to the glasses-print branch
        run: |
          mkdir -p /tmp/print && cp Lens-glasses-v2_TAZ6-Aerostruder_PLA.gcode glasses/hardware/stl/lens_glasses_plate.stl /tmp/print/
          cp profiles/*.json /tmp/print/
          cd /tmp/print
          git init -q && git checkout -q -b glasses-print
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Lens glasses G-code, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" glasses-print
      - name: Publish release glasses-print-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "glasses-print-${{ github.run_number }}" \
            Lens-glasses-v2_TAZ6-Aerostruder_PLA.gcode glasses/hardware/stl/lens_glasses_plate.stl \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "Lens glasses v2 print, build ${{ github.run_number }}" \
            --notes "G-code for a LulzBot TAZ 6 with the Aerostruder (2.85 mm PLA, 0.5 mm nozzle): the front, both temples and both lids on one plate. The STL is the same plate, to slice yourself."
