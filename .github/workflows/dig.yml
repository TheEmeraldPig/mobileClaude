name: Build Deep Dig

# Builds DeepDig.apk (Android) and DeepDig.exe (Windows) on every push that changes
# the game, then publishes them as a release named dig-build-<number>.
on:
  push:
    paths:
      - 'dig/**'
      - '.github/workflows/dig.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: dig/go.sum
      - name: Install libraries for tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev xvfb
      - name: Test
        run: xvfb-run -a go test ./game
      - name: Build DeepDig.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X github.com/TheEmeraldPig/mobileClaude/dig/game.Version=${{ github.run_number }}" \
            -o DeepDig.exe ./cmd/dig
      - uses: actions/upload-artifact@v4
        with:
          name: dig-windows
          path: dig/DeepDig.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: dig/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the Android SDK and NDK that come with the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - name: Build the game library (.aar)
        working-directory: dig
        run: |
          mkdir -p android/app/libs
          go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.8.8
          ebitenmobile bind -target android -androidapi 23 -javapkg com.theemeraldpig.dig \
            -ldflags "-X github.com/TheEmeraldPig/mobileClaude/dig/game.Version=${{ github.run_number }}" \
            -o android/app/libs/dig.aar ./mobile
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build DeepDig.apk
        working-directory: dig/android
        run: |
          gradle assembleRelease -PdigVersion=${{ github.run_number }} --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../DeepDig.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dig-android
          path: dig/DeepDig.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dig-*
          merge-multiple: true
      # Not marked "latest": Mote's updater reads the latest release.
      - name: Publish release dig-build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dig-build-${{ github.run_number }}" DeepDig.apk DeepDig.exe \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "Deep Dig build ${{ github.run_number }}" \
            --notes "Android: download DeepDig.apk on your phone and open it to install. Windows: download DeepDig.exe and run it."
