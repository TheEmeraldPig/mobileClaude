<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Sandbox</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101216; --panel: #1b1f27; --line: #2c3340; --fg: #e8ecf2; --muted: #8a94a6; --accent: #f2b84b;
    --btn: 64px;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  [hidden] { display: none !important; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #top { display: flex; gap: 6px; padding: 8px max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; align-items: center; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top button, #pad button, #settings button { font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer; }
  .tool { padding: 7px 11px; border: 2px solid transparent; color: #111; }
  .tool.active { border-color: var(--fg); }
  #gear { margin-left: auto; padding: 7px 11px; background: var(--line); color: var(--fg); border: 0; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #view { position: absolute; left: 0; top: 0; display: block; }
  #pad { display: flex; justify-content: space-between; gap: 10px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: var(--panel); border-top: 1px solid var(--line); }
  #pad .grp { display: flex; gap: 10px; }
  #pad button { width: var(--btn); height: var(--btn); font-size: calc(var(--btn) * 0.38); background: var(--line); color: var(--fg); border: 0; touch-action: none; }
  #pad button.down { background: var(--accent); color: #111; }
  #settings { position: absolute; right: 8px; top: 8px; width: min(300px, calc(100% - 16px)); box-sizing: border-box; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 2; }
  #settings h2 { margin: 0; font-size: 15px; }
  #settings label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  #settings label span { display: flex; justify-content: space-between; }
  #settings label b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #settings .row { display: flex; align-items: center; gap: 8px; color: var(--fg); }
  #settings input[type=range] { width: 100%; accent-color: var(--accent); }
  #close { padding: 8px; background: var(--accent); color: #111; border: 0; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><button id="gear" aria-label="Settings">⚙ Settings</button></div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="settings" hidden>
      <h2>Settings</h2>
      <label for="s-cell"><span>Pixel size <b id="v-cell"></b></span><input id="s-cell" type="range" min="1" max="8" step="1"></label>
      <label for="s-brush"><span>Brush size <b id="v-brush"></b></span><input id="s-brush" type="range" min="1" max="12" step="1"></label>
      <label for="s-speed"><span>Player speed <b id="v-speed"></b></span><input id="s-speed" type="range" min="1" max="6" step="0.5"></label>
      <label for="s-jump"><span>Jump height <b id="v-jump"></b></span><input id="s-jump" type="range" min="3" max="12" step="0.5"></label>
      <label for="s-btn"><span>Button size <b id="v-btn"></b></span><input id="s-btn" type="range" min="44" max="96" step="4"></label>
      <label class="row" for="s-pad"><input id="s-pad" type="checkbox"> Show touch controls</label>
      <p class="hint">Keyboard: A/D or arrows to move, W, Up or Space to jump.</p>
      <button id="close">Done</button>
    </div>
  </div>
  <div id="pad">
    <div class="grp"><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div>
    <div class="grp"><button data-k="jump" aria-label="Jump">▲</button></div>
  </div>
</div>
<script>
const EMPTY = 0, SAND = 1, WATER = 2, STONE = 3;
const TYPES = [
  { id: SAND,  name: 'Sand',  color: '#e2c26b' },
  { id: WATER, name: 'Water', color: '#3b8ee8' },
  { id: STONE, name: 'Stone', color: '#8d93a0' },
  { id: EMPTY, name: 'Erase', color: '#d6dae2' },
];
const RGB = { [SAND]: [226, 194, 107], [WATER]: [59, 142, 232], [STONE]: [141, 147, 160] };

// ---- Settings (saved per browser) ----
const settings = { cell: 3, brush: 4, speed: 2.5, jump: 7, btn: 64, pad: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem('sandbox-settings') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('sandbox-settings', JSON.stringify(settings)); } catch (e) {} };

// ---- World ----
let W = 0, H = 0, cell = settings.cell, grid = new Uint8Array(0);
let current = SAND;

const stage = document.getElementById('stage');
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const off = document.createElement('canvas');
const octx = off.getContext('2d');
let img = null;

// Player position/size are in screen px; the world is in cells.
const player = { x: 40, y: 0, w: 10, h: 20, vx: 0, vy: 0, onGround: false, inWater: false, face: 1 };

// Rebuild the grid for the current stage size / pixel size, keeping content anchored to the bottom.
function rebuild(newCell) {
  const oldW = W, oldH = H, old = grid, oldCell = cell;
  cell = newCell;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  W = Math.max(10, Math.floor(sw / cell));
  H = Math.max(10, Math.floor(sh / cell));
  grid = new Uint8Array(W * H);
  if (old.length) {
    const r = oldCell / cell; // new cells per old cell
    for (let y = 0; y < H; y++) {
      const oy = oldH - 1 - Math.floor((H - 1 - y) / r);
      if (oy < 0 || oy >= oldH) continue;
      for (let x = 0; x < W; x++) {
        const ox = Math.floor(x / r);
        if (ox < oldW) grid[y * W + x] = old[oy * oldW + ox];
      }
    }
    // keep the player at the same spot relative to the bottom
    player.y = H * cell - (oldH * oldCell - player.y);
  }
  off.width = W; off.height = H;
  img = octx.createImageData(W, H);
  const dpr = window.devicePixelRatio || 1;
  view.width = W * cell * dpr; view.height = H * cell * dpr;
  view.style.width = W * cell + 'px'; view.style.height = H * cell + 'px';
  view.style.left = Math.floor((sw - W * cell) / 2) + 'px';
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vctx.imageSmoothingEnabled = false;
  player.x = Math.min(Math.max(0, player.x), W * cell - player.w);
  unstick();
}

function seedWorld() {
  // A little starting terrain so the player has something to stand on
  for (let x = 0; x < W; x++) {
    const ground = Math.floor(H * 0.85 + Math.sin(x / W * 6) * H * 0.04);
    for (let y = ground; y < H; y++) grid[y * W + x] = y > ground + 3 ? STONE : SAND;
  }
  player.x = W * cell * 0.2; player.y = 0;
}

// ---- Toolbar ----
const topBar = document.getElementById('top');
const gear = document.getElementById('gear');
for (const t of TYPES) {
  const b = document.createElement('button');
  b.className = 'tool' + (t.id === current ? ' active' : '');
  b.textContent = t.name;
  b.style.background = t.color;
  b.onclick = () => {
    current = t.id;
    topBar.querySelectorAll('.tool').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  };
  topBar.insertBefore(b, gear);
}
const clearBtn = document.createElement('button');
clearBtn.className = 'tool'; clearBtn.textContent = 'Clear'; clearBtn.style.background = '#f07a6a';
clearBtn.onclick = () => grid.fill(EMPTY);
topBar.insertBefore(clearBtn, gear);

// ---- Settings panel ----
const panel = document.getElementById('settings');
const pad = document.getElementById('pad');
gear.onclick = () => panel.hidden = !panel.hidden;
document.getElementById('close').onclick = () => panel.hidden = true;
const fmt = { cell: v => v + 'px', brush: v => v, speed: v => v, jump: v => v, btn: v => v + 'px' };
for (const key of ['cell', 'brush', 'speed', 'jump', 'btn']) {
  const input = document.getElementById('s-' + key), out = document.getElementById('v-' + key);
  input.value = settings[key]; out.textContent = fmt[key](settings[key]);
  input.oninput = () => {
    settings[key] = +input.value; out.textContent = fmt[key](settings[key]); save();
    if (key === 'cell') rebuild(settings.cell);
    if (key === 'btn') applyPad();
  };
}
const padToggle = document.getElementById('s-pad');
padToggle.checked = settings.pad;
padToggle.onchange = () => { settings.pad = padToggle.checked; save(); applyPad(); };
function applyPad() {
  pad.hidden = !settings.pad;
  document.documentElement.style.setProperty('--btn', settings.btn + 'px');
  rebuild(cell);
}

// ---- Input ----
const keys = { left: false, right: false, jump: false };
const keyMap = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'jump', w: 'jump', W: 'jump', ' ': 'jump' };
addEventListener('keydown', e => { if (keyMap[e.key]) { keys[keyMap[e.key]] = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (keyMap[e.key]) keys[keyMap[e.key]] = false; });
for (const b of pad.querySelectorAll('button')) {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('down'); };
  const offFn = () => { keys[k] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', offFn);
  b.addEventListener('pointercancel', offFn);
  b.addEventListener('pointerleave', offFn);
}
addEventListener('contextmenu', e => e.preventDefault());

let drawing = false, cx = 0, cy = 0;
function toCell(e) {
  const r = view.getBoundingClientRect();
  cx = Math.floor((e.clientX - r.left) / cell);
  cy = Math.floor((e.clientY - r.top) / cell);
}
view.addEventListener('pointerdown', e => { panel.hidden = true; drawing = true; toCell(e); view.setPointerCapture(e.pointerId); });
view.addEventListener('pointermove', e => { if (drawing) toCell(e); });
view.addEventListener('pointerup', () => drawing = false);
view.addEventListener('pointercancel', () => drawing = false);

function paint() {
  const br = settings.brush;
  for (let dy = -br; dy <= br; dy++)
    for (let dx = -br; dx <= br; dx++) {
      if (dx * dx + dy * dy > br * br) continue;
      const x = cx + dx, y = cy + dy;
      if (x < 0 || x >= W || y < 0 || y >= H || inPlayer(x, y)) continue;
      if ((current === SAND || current === WATER) && Math.random() < 0.5) continue;
      grid[y * W + x] = current;
    }
}

// ---- Player ----
let px0 = 0, px1 = -1, py0 = 0, py1 = -1; // player's cell rectangle, used by the sim as solid
function updatePlayerCells() {
  px0 = Math.floor(player.x / cell); px1 = Math.floor((player.x + player.w - 0.01) / cell);
  py0 = Math.floor(player.y / cell); py1 = Math.floor((player.y + player.h - 0.01) / cell);
}
const inPlayer = (x, y) => x >= px0 && x <= px1 && y >= py0 && y <= py1;
const isSolid = t => t === SAND || t === STONE;

function hits(x, y) {
  const x0 = Math.floor(x / cell), x1 = Math.floor((x + player.w - 0.01) / cell);
  const y0 = Math.floor(y / cell), y1 = Math.floor((y + player.h - 0.01) / cell);
  if (x0 < 0 || x1 >= W || y1 >= H) return true;
  for (let cy = Math.max(0, y0); cy <= y1; cy++)
    for (let cx = x0; cx <= x1; cx++) if (isSolid(grid[cy * W + cx])) return true;
  return false;
}
function unstick() {
  for (let i = 0; i < H * cell && hits(player.x, player.y); i++) player.y -= 1;
}

function updatePlayer() {
  const p = player;
  const mx = cx => { const c = Math.floor((p.x + p.w / 2) / cell), r = Math.floor((p.y + p.h / 2) / cell); return grid[r * W + c]; };
  p.inWater = mx() === WATER;
  const speed = settings.speed * (p.inWater ? 0.6 : 1);
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) p.face = dir;
  p.vx += (dir * speed - p.vx) * 0.35;
  p.vy += p.inWater ? 0.15 : 0.45;
  p.vy = Math.min(p.vy, p.inWater ? 2 : 10);
  if (keys.jump && (p.onGround || p.inWater)) { p.vy = p.inWater ? -settings.jump * 0.45 : -settings.jump; p.onGround = false; }

  // Horizontal: move 1px at a time, stepping up small ledges
  const stepUp = Math.max(cell * 2, 6);
  let dx = p.vx;
  while (Math.abs(dx) > 0) {
    const s = Math.sign(dx) * Math.min(1, Math.abs(dx));
    if (!hits(p.x + s, p.y)) p.x += s;
    else {
      let climbed = false;
      for (let up = 1; up <= stepUp; up++) if (!hits(p.x + s, p.y - up)) { p.x += s; p.y -= up; climbed = true; break; }
      if (!climbed) { p.vx = 0; break; }
    }
    dx -= s;
  }
  // Vertical
  let dy = p.vy; p.onGround = false;
  while (Math.abs(dy) > 0) {
    const s = Math.sign(dy) * Math.min(1, Math.abs(dy));
    if (!hits(p.x, p.y + s)) p.y += s;
    else { if (s > 0) p.onGround = true; p.vy = 0; break; }
    dy -= s;
  }
  if (p.y > H * cell) { p.y = 0; } // fell out somehow, drop back in from the top
  updatePlayerCells();
}

function drawPlayer() {
  const p = player, x = Math.round(p.x), y = Math.round(p.y);
  vctx.fillStyle = '#3fbf7f'; vctx.fillRect(x, y + 7, p.w, p.h - 11);    // body
  vctx.fillStyle = '#2b5fa8'; vctx.fillRect(x + 1, y + p.h - 4, 3, 4);   // legs
  vctx.fillRect(x + p.w - 4, y + p.h - 4, 3, 4);
  vctx.fillStyle = '#f1c9a5'; vctx.fillRect(x + 1, y, p.w - 2, 7);       // head
  vctx.fillStyle = '#111';                                                 // eye
  vctx.fillRect(p.face > 0 ? x + p.w - 4 : x + 2, y + 2, 2, 2);
}

// ---- Sand / water sim ----
const get = (x, y) => (x < 0 || x >= W || y < 0 || y >= H || inPlayer(x, y)) ? STONE : grid[y * W + x];
function swap(a, b) { const t = grid[a]; grid[a] = grid[b]; grid[b] = t; }

function step() {
  for (let y = H - 2; y >= 0; y--) {
    const ltr = Math.random() < 0.5;
    for (let i = 0; i < W; i++) {
      const x = ltr ? i : W - 1 - i;
      const idx = y * W + x;
      const t = grid[idx];
      if (t === SAND) {
        const below = get(x, y + 1);
        if (below === EMPTY || below === WATER) { swap(idx, idx + W); continue; }
        const d = Math.random() < 0.5 ? -1 : 1;
        for (const dx of [d, -d]) {
          const n = get(x + dx, y + 1);
          if (n === EMPTY || n === WATER) { swap(idx, idx + W + dx); break; }
        }
      } else if (t === WATER) {
        if (get(x, y + 1) === EMPTY) { swap(idx, idx + W); continue; }
        const d = Math.random() < 0.5 ? -1 : 1;
        let moved = false;
        for (const dx of [d, -d]) {
          if (get(x + dx, y + 1) === EMPTY) { swap(idx, idx + W + dx); moved = true; break; }
        }
        if (moved) continue;
        for (const dx of [d, -d]) {
          if (get(x + dx, y) === EMPTY) { swap(idx, idx + dx); break; }
        }
      }
    }
  }
}

function render() {
  const data = img.data;
  for (let i = 0; i < grid.length; i++) {
    const c = RGB[grid[i]], o = i * 4;
    if (c) { data[o] = c[0]; data[o + 1] = c[1]; data[o + 2] = c[2]; }
    else { data[o] = 16; data[o + 1] = 18; data[o + 2] = 22; }
    data[o + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  vctx.drawImage(off, 0, 0, W * cell, H * cell);
  drawPlayer();
}

function loop() {
  if (drawing) paint();
  updatePlayer();
  step();
  render();
  requestAnimationFrame(loop);
}

addEventListener('resize', () => rebuild(cell));
pad.hidden = !settings.pad;
document.documentElement.style.setProperty('--btn', settings.btn + 'px');
rebuild(settings.cell);
seedWorld();
loop();
</script>
</body>
</html>
