plugins {
    id 'com.android.application'
}

// CI passes the build number so each build installs over the last one
def moteVersion = (project.findProperty('moteVersion') ?: '1').toString()

android {
    namespace 'com.theemeraldpig.mote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.theemeraldpig.mote'
        minSdk 23
        targetSdk 34
        versionCode moteVersion.toInteger()
        versionName "build-" + moteVersion
    }

    // A fixed key for installing the APK directly on your phone, so new builds update the old one.
    // For Google Play, sign with your own private upload key instead.
    signingConfigs {
        sideload {
            storeFile rootProject.file('mote-sideload.keystore')
            storePassword 'android'
            keyAlias 'mote'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
