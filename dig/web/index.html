<title>Deep Dig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One full-screen canvas; the game draws everything. Single dark look on purpose. */
  :root { --bg: #1d1622; --fg: #f0e8f5; --dim: #a898b8; --gold: #f5c542; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: system-ui, sans-serif; }
  #load { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center;
          padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #load h1 { margin: 0; color: var(--gold); font-size: 2.2rem; letter-spacing: .04em; }
  #load p { margin: 0; color: var(--dim); }
  canvas { touch-action: none; }
</style>
<div id="load"><h1>Deep Dig</h1><p id="msg">Loading the mine...</p></div>
<script src="wasm_exec.js"></script>
<script>
(async () => {
  const msg = document.getElementById('msg');
  try {
    const res = await fetch('dig.gz.wasm');
    if (!res.ok) throw new Error('could not download the game (' + res.status + ')');
    const bytes = await new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    const go = new Go();
    const { instance } = await WebAssembly.instantiate(bytes, go.importObject);
    document.getElementById('load').remove();
    go.run(instance);
  } catch (e) {
    msg.textContent = 'The game did not start: ' + e.message + '. Reload the page to try again.';
  }
})();
</script>
